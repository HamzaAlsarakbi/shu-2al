[project]
name = "shu2al-worker"
version = "0.2.0"
description = "GPU model stages for shu-2al: VAD, ASR, forced alignment"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "soundfile>=0.13"]

[project.optional-dependencies]
# Model stages. Optional so CI can test the protocol and chunking without torch.
models = [
  "torch>=2.15",
  "transformers>=5.4",
  "accelerate>=1",
  "sentencepiece",
  "protobuf",
  "librosa",
  "silero-vad>=6.2",
  "ctc-forced-aligner",
]
# Offline fine-tuning jobs (train_mt).
train = ["peft>=0.17", "sacrebleu>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv.sources]
# CUDA 13.2 wheels on Linux (driver 615 on the 3070 box); default PyPI wheels on macOS.
torch = { index = "pytorch-cu132", marker = "sys_platform == 'linux'" }
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner", rev = "64293cc6d711e57666c4a8b098e9fd93b381fd88" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shu2al_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
